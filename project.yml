name: Ghostwriter
options:
  bundleIdPrefix: com.mshl
  deploymentTarget:
    macOS: "26.0"
  projectFormat: xcode16_0
  xcodeVersion: "27.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 7P98PG3748
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
packages:
  GhostwriterKit:
    path: Packages/GhostwriterKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Ghostwriter:
    type: application
    platform: macOS
    sources:
      - path: Ghostwriter
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mshl.ghostwriter
        PRODUCT_NAME: Ghostwriter
        INFOPLIST_FILE: Ghostwriter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Ghostwriter/Ghostwriter.entitlements
        CODE_SIGN_IDENTITY: Developer ID Application
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
      configs:
        Release:
          OTHER_CODE_SIGN_FLAGS: --timestamp
    dependencies:
      - package: GhostwriterKit
        products: [GWCore, Inference, Prompting, Memory, Capture, Input, Overlay, ScreenContext, Actions, Proofing]
      - package: KeyboardShortcuts
      - package: Sparkle
    scheme: {}
