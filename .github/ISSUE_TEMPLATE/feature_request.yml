name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for this idea.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that Ghostwriter does not let you do now?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Other ways to solve the problem that you considered.
